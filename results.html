<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promethia Quest · Live results</title><meta name="robots" content="noindex"><link rel="icon" href="assets/favicon-32.png">
<style>
:root{--navy:#1a2a4f;--navy2:#24386a;--org:#f26b21;--gold:#ffd23f;--bg:#f6f3ef;--card:#fff;--mut:#6b7590}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--navy);font-size:15px}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px #0003;position:sticky;top:0;z-index:5}
header img{width:38px;border-radius:9px}header h1{font-size:18px;margin:0}header h1 b{color:var(--org)}header small{opacity:.75;display:block;font-size:12px}
header .live{margin-left:auto;font-size:12px;background:#ffffff1a;padding:6px 10px;border-radius:20px;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc84;margin-right:6px;animation:p 2s infinite}@keyframes p{50%{opacity:.3}}
main{padding:16px;max-width:1200px;margin:auto}
button{font:inherit;background:var(--org);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:42px}button.sec{background:var(--navy)}
#gate{max-width:340px;margin:70px auto;text-align:center;background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #1a2a4f22}
#gate img{width:64px;border-radius:14px}#gate input{font-size:22px;padding:10px;width:100%;text-align:center;border-radius:10px;border:2px solid #1a2a4f33;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kc{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px #1a2a4f12;border-top:4px solid var(--org)}.kc:nth-child(2n){border-top-color:var(--navy)}
.kc small{color:var(--mut);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em}.kc b{display:block;font-size:28px;margin-top:4px}.kc em{font-style:normal;font-size:12px;color:var(--mut)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:10px 12px;border-radius:14px;margin:14px 0 0;box-shadow:0 2px 8px #1a2a4f12}
.bar input,.bar select{padding:9px;border:1px solid #ccd;border-radius:10px;font:inherit;min-height:42px}.bar input{flex:1;min-width:150px}
.tw{overflow:auto;margin-top:12px;background:#fff;border-radius:14px;box-shadow:0 2px 8px #1a2a4f12}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #eef;padding:10px;text-align:left;white-space:nowrap}
th{background:var(--navy);color:#fff;position:sticky;top:0;cursor:pointer;user-select:none;font-size:13px}tbody tr{cursor:pointer}tbody tr:hover td{background:#eef4ff}
tr.new td{background:#fff3e8;animation:fl 2s}@keyframes fl{from{background:#ffd9b8}}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#eef1f8}.sc{font-weight:800;color:#fff;background:var(--org);padding:3px 9px;border-radius:8px}
.t-Legendary{background:#ffe9a8}.t-Torchbearer{background:#ffe0cc}.t-Flame{background:#dce8ff}
#st{font-size:12px;color:var(--mut)}
/* modal */
#ov{position:fixed;inset:0;background:#0b1430aa;display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:20px 10px;overflow:auto}
#md{background:var(--bg);max-width:820px;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0007}
.mh{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 20px;position:relative}.mh h2{margin:0;font-size:22px}.mh .ti{color:var(--gold);font-weight:800;margin-top:4px}
.mh .x{position:absolute;right:12px;top:12px;background:#ffffff22;min-height:0;padding:6px 12px}
.mh .big{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.mh .big div{background:#ffffff18;border-radius:12px;padding:8px 12px;font-size:12px}.mh .big b{display:block;font-size:20px}
.mb{padding:14px 16px}.sec2{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #1a2a4f10}.sec2 h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.hb{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.hb .t{background:#eef1f8;border-radius:8px;height:14px;overflow:hidden}.hb i{display:block;height:100%;background:linear-gradient(90deg,var(--org),#ff9a4d);border-radius:8px}.hb b{text-align:right}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 12px;font-size:14px}.kv dt{color:var(--mut);font-weight:600}.kv dd{margin:0;word-break:break-word}
.lv{width:100%;font-size:13px}.lv td,.lv th{padding:7px 6px;white-space:normal}.lv th{position:static;cursor:default;background:#eef1f8;color:var(--navy)}
.ok{color:#1a8f4a;font-weight:700}.bad{color:#b3202f;font-weight:700}.skip{color:#a66b00;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px}.badges span{background:#fff3e8;border:1px solid #ffd2b3;border-radius:20px;padding:5px 10px;font-size:13px}
details.raw summary{cursor:pointer;font-weight:700}details.raw pre{background:#0b1430;color:#cfe0ff;padding:12px;border-radius:10px;overflow:auto;font-size:12px;max-height:400px}
.muted{color:var(--mut);font-style:italic}
@media(max-width:640px){th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}.hb{grid-template-columns:105px 1fr 48px}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}header .live{display:none}.kc b{font-size:22px}}
</style></head><body>
<header><img src="assets/logo-mark-96.png" alt=""><div><h1><b>Promethia</b> Quest · Live results</h1><small>All devices · saved in the cloud</small></div><span class="live" id="live" hidden><span class="dot"></span><span id="st">Live</span></span></header>
<div id="gate"><img src="assets/logo-mark-96.png" alt=""><h2>Scout PIN</h2><input id="pin" type="password" autocomplete="off" inputmode="numeric"><button id="go" style="width:100%">Open results</button><p id="err" style="color:#b3202f"></p></div>
<main id="app" hidden>
  <div class="cards" id="cards"></div>
  <div class="bar"><input id="q" placeholder="🔍 Search name, grade, title"><select id="fG"><option value="">All grades</option></select><button id="csv">⬇ CSV</button></div>
  <div class="tw"><table id="t"></table></div>
  <p style="font-size:12px;color:#777">Auto-refreshes every 10 seconds. Tap a column to sort, tap a child to see everything.</p>
</main>
<script src="config.js?v=v8"></script>
<script>
const $=s=>document.querySelector(s),C=window.PQ_CONFIG||{};
let PIN=null,rows=[],sortK='created_at',sortD=-1,seen=new Set(),first=true;
const COLS=[['name','Name'],['grade_section','Grade'],['score','Score'],['title','Title'],['time_taken','Time'],['created_at','When (IST)']];
const SK=[['problem','🧩 Problem-solving',35],['persistence','💪 Persistence',20],['curiosity','🔍 Curiosity',15],['creativity','🎨 Creativity',20],['communication','🗣️ Communication',10]];
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const ist=t=>{if(!t)return '';const d=new Date(t);return isNaN(d)?String(t):d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' IST'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtS=s=>s==null||isNaN(s)?'–':Math.floor(s/60)+'m '+String(Math.round(s%60)).padStart(2,'0')+'s';
const grade=r=>{const g=(r.details&&r.details.grade)||String(r.grade_section||'').split(' ')[0];return g?String(g):''};
$('#go').onclick=async()=>{const p=$('#pin').value.trim();if(await sha(p)===C.SCOUT_PIN_SHA256){PIN=p;$('#pin').value='';$('#gate').hidden=true;$('#app').hidden=false;$('#live').hidden=false;load();setInterval(load,10000)}else $('#err').textContent='Wrong PIN'};
$('#pin').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
async function load(){
  try{const r=await fetch(C.SUPABASE_URL+'/rest/v1/rpc/get_quest_results',{method:'POST',headers:{apikey:C.SUPABASE_KEY,Authorization:'Bearer '+C.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({pin:PIN})});
    if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const fresh=new Set();d.forEach(x=>{if(!first&&!seen.has(x.id))fresh.add(x.id);seen.add(x.id)});first=false;
    rows=d.map(x=>({...x,details:(x.details&&typeof x.details==='object')?x.details:{},_new:fresh.has(x.id)}));$('#st').textContent='Live · '+new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'})+' IST';render();
  }catch(e){$('#st').textContent='⚠ offline ('+e.message+'), retrying'}}
function view(){const q=$('#q').value.trim().toLowerCase(),g=$('#fG').value;return rows.filter(r=>(!g||grade(r)===g)&&(!q||[r.name,r.grade_section,r.title].join(' ').toLowerCase().includes(q))).sort((a,b)=>{let x=a[sortK],y=b[sortK];if(sortK==='score'){x=+x||0;y=+y||0}else if(sortK==='time_taken'){x=+a.details.totalSec||0;y=+b.details.totalSec||0}else{x=String(x??'').toLowerCase();y=String(y??'').toLowerCase()}return (x>y?1:x<y?-1:0)*sortD})}
function cards(v){const sc=v.map(r=>+r.score).filter(n=>!isNaN(n)&&r_ok(n));const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):'–';const top=v.filter(r=>!isNaN(+r.score)).sort((a,b)=>b.score-a.score)[0];
  const ts=v.map(r=>+r.details.totalSec).filter(n=>n>0);const at=ts.length?fmtS(ts.reduce((a,b)=>a+b,0)/ts.length):'–';const today=v.filter(r=>new Date(r.created_at).toDateString()===new Date().toDateString()).length;
  $('#cards').innerHTML=`<div class="kc"><small>Players</small><b>${v.length}</b><em>${today} today</em></div><div class="kc"><small>Average score</small><b>${avg}</b><em>out of 100</em></div><div class="kc"><small>Top score</small><b>${top?esc(top.score):'–'}</b><em>${top?esc(top.name):''}</em></div><div class="kc"><small>Avg time</small><b>${at}</b><em>per game</em></div>`}
function r_ok(n){return n>=0&&n<=100}
function render(){const gs=[...new Set(rows.map(grade).filter(Boolean))].sort((a,b)=>a-b),sel=$('#fG'),cur=sel.value;sel.innerHTML='<option value="">All grades</option>'+gs.map(g=>`<option value="${esc(g)}">Grade ${esc(g)}</option>`).join('');sel.value=cur;
  const v=view();cards(v);
  $('#t').innerHTML='<thead><tr><th>#</th>'+COLS.map(([k,n])=>`<th data-k="${k}">${n}${k===sortK?(sortD>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+(v.length?v.map((r,i)=>`<tr data-id="${r.id}" class="${r._new?'new':''}"><td>${i+1}</td><td><b>${esc(r.name)||'<span class=muted>no name</span>'}</b></td><td>${esc(r.grade_section)}</td><td><span class="sc">${esc(r.score??'–')}</span></td><td><span class="pill t-${esc(String(r.title||'').split(' ')[0])}">${esc(r.title||'–')}</span></td><td>${esc(r.time_taken||'–')}</td><td>${ist(r.created_at)}</td></tr>`).join(''):'<tr><td colspan=7 class=muted style="text-align:center;padding:30px">No results yet</td></tr>')+'</tbody>';
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortK)sortD=-sortD;else{sortK=k;sortD=['name','grade_section','title'].includes(k)?1:-1}render()});
  document.querySelectorAll('tbody tr[data-id]').forEach(tr=>tr.onclick=()=>open1(rows.find(r=>String(r.id)===tr.dataset.id)))}
$('#q').oninput=render;$('#fG').onchange=render;
/* ---------- detail modal ---------- */
const LBL={who:'Hero of the story',where:'Where',problem:'Problem',ending:'Ending / how it was solved',words:'Words written',name:'Name',does:'What it does',parts:'Parts used',line:'Line spoken',pickedIdea:'Picked a ready idea',wrongPicks:'Wrong picks',round2:'Round 2 line',round2Tries:'Round 2 tries',how:'How they beat it',lineWords:'Words in line',heartsLeft:'Hearts left',good:'Correct',miss:'Missed',ratio:'Accuracy',kind:'Type',acc:'Accuracy',timeFrac:'Speed score',perfect:'Perfect rounds',bonus:'Bonus free build',blocks:'Blocks',materials:'Materials',height:'Height',footprint:'Footprint',type:'Build type',why:'Why (their reason)',whyWords:'Words in reason',rounds:'Rounds',puzzles:'Puzzles'};
const human=k=>LBL[k]||String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
function val(k,v){if(v==null||v==='')return '<span class=muted>–</span>';if(typeof v==='boolean')return v?'✅ Yes':'❌ No';if((k==='ratio'||k==='acc'||k==='timeFrac')&&typeof v==='number'&&v<=1)return Math.round(v*100)+'%';
  if(Array.isArray(v))return v.length?v.map(x=>typeof x==='object'&&x?Object.entries(x).map(([a,b])=>human(a)+': '+esc(typeof b==='object'?JSON.stringify(b):b)).join(', '):esc(x)).map(s=>'<div>• '+s+'</div>').join(''):'<span class=muted>none</span>';
  if(typeof v==='object')return kv(v);return esc(v)}
function kv(o){const e=Object.entries(o||{}).filter(([k])=>!k.startsWith('_'));return e.length?'<dl class="kv">'+e.map(([k,v])=>`<dt>${esc(human(k))}</dt><dd>${val(k,v)}</dd>`).join('')+'</dl>':'<span class=muted>Not recorded</span>'}
const sec=(t,h)=>`<div class="sec2"><h3>${t}</h3>${h}</div>`;
function open1(r){if(!r)return;const d=r.details||{},s=d.scores||{};const lv=Array.isArray(d.levels)?d.levels:[];const istars=d.islandStars||[];
  let h=`<div class="mh"><button class="x" onclick="closeM()">✕</button><h2>${esc(r.name||d.name||'Unnamed')}</h2><div class="ti">🏆 ${esc(r.title||d.title||'–')}</div>
  <div class="big"><div><b>${esc(r.score??s.total??'–')}</b>score /100</div><div><b>${esc(r.time_taken||fmtS(d.totalSec))}</b>time</div><div><b>${esc(r.grade_section||'–')}</b>grade</div>${d.stars!=null?`<div><b>⭐ ${esc(d.stars)}</b>secret stars</div>`:''}${d.embers!=null?`<div><b>🔥 ${esc(d.embers)}</b>embers</div>`:''}${d.firstTry!=null?`<div><b>${esc(d.firstTry)}/${esc(d.puzzles??'?')}</b>first-try puzzles</div>`:''}</div></div><div class="mb">`;
  h+=sec('📊 Skill scores',SK.some(([k])=>s[k]!=null)?SK.map(([k,n,m])=>{const v=+s[k]||0;return `<div class="hb"><span>${n}</span><span class="t"><i style="width:${Math.round(100*Math.min(1,v/m))}%"></i></span><b>${s[k]??'–'}/${m}</b></div>`}).join('')+(d.goodAt?`<p style="margin:8px 0 0"><b>Good at:</b> ${esc(d.goodAt)}</p>`:''):'<span class=muted>No skill breakdown recorded (test or older entry)</span>');
  if(d.badges&&d.badges.length)h+=sec('🎖️ Badges earned','<div class="badges">'+d.badges.map(b=>`<span>${esc(b)}</span>`).join('')+'</div>');
  h+=sec('🏝️ Island by island',lv.length?`<div style="overflow:auto"><table class="lv"><thead><tr><th>#</th><th>Island</th><th>Skill</th><th>Result</th><th>Time</th><th>Tries</th><th>Fails</th><th>Hints</th><th>Stars</th><th>Explore</th></tr></thead><tbody>${lv.map((l,i)=>!l?`<tr><td>${i+1}</td><td colspan=9 class=muted>Not reached</td></tr>`:`<tr><td>${i+1}</td><td><b>${esc(l.name||l.id||'')}</b>${istars[i]!=null?`<br><small>${'★'.repeat(istars[i])}${'☆'.repeat(Math.max(0,3-istars[i]))}</small>`:''}</td><td>${esc(l.skill||'')}</td><td>${l.skipped?'<span class=skip>⏭ Skipped</span>':l.completed?'<span class=ok>✓ Done</span>'+(l.firstTry?' <small>first try</small>':''):'<span class=bad>✗ Not done</span>'}</td><td>${fmtS(l.time)}</td><td>${esc(l.attempts??'–')}</td><td>${esc(l.fails??'–')}</td><td>${esc(l.hints??'–')}</td><td>${esc(l.stars??'–')}</td><td>${esc(l.explore??'–')}</td></tr>`).join('')}</tbody></table></div>`:'<span class=muted>No per-island data recorded</span>');
  const ans=[['🗣️ Stage speech',d.speech],['🧱 Build challenge',d.build],['📖 Story (tale)',d.tale],['💡 Gadget invention',d.invent],['🐢 Word / voice game',d.voice],['🐉 Boss reflection',d.boss]].filter(([,o])=>o&&typeof o==='object'&&Object.keys(o).length);
  if(ans.length)h+=sec('✍️ What they made & said',ans.map(([t,o])=>`<h4 style="margin:12px 0 6px;color:#f26b21">${t}</h4>`+kv(o)).join(''));
  const prof={School:d.school,Grade:d.grade,Section:d.section,'Grade band':d.band,'PC / device':d.pc,Avatar:d.avatar,Hero:d.hero,'Attempt ID':d.id,Started:ist(d.startedAt),Finished:ist(d.finishedAt),'Saved to cloud':ist(r.created_at),'Email sent':d.sent,'Test run':d.test};
  h+=sec('👤 Player & session',kv(Object.fromEntries(Object.entries(prof).filter(([,v])=>v!=null&&v!==''))));
  const known=new Set(['id','test','name','school','band','grade','section','pc','avatar','hero','startedAt','finishedAt','totalSec','levels','build','speech','boss','voice','tale','invent','stars','embers','scores','firstTry','puzzles','title','sent','sentAt','tryAt','badges','badgeIds','islandStars','goodAt']);
  const extra=Object.fromEntries(Object.entries(d).filter(([k])=>!known.has(k)));if(Object.keys(extra).length)h+=sec('➕ Other recorded fields',kv(extra));
  h+=`<details class="raw sec2"><summary>Raw data (JSON)</summary><pre>${esc(JSON.stringify(r.details,null,2))}</pre></details></div>`;
  const o=document.createElement('div');o.id='ov';o.innerHTML='<div id="md">'+h+'</div>';o.onclick=e=>{if(e.target===o)closeM()};document.body.appendChild(o);document.body.style.overflow='hidden'}
function closeM(){$('#ov')?.remove();document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const hd=['Name','Grade','Score','Title','Time','When (IST)'].concat(SK.map(x=>x[1].replace(/^\S+ /,'')),['Good at','School','Stars','Embers','Badges','Details JSON']);
  const csv=[hd.map(q).join(',')].concat(view().map(r=>{const d=r.details||{},s=d.scores||{};return [r.name,r.grade_section,r.score,r.title,r.time_taken,ist(r.created_at)].concat(SK.map(x=>s[x[0]]),[d.goodAt,d.school,d.stars,d.embers,(d.badges||[]).join('; '),JSON.stringify(d)]).map(q).join(',')})).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='promethia-quest-results-'+new Date().toISOString().slice(0,10)+'.csv';a.click()};
</script>
</body></html>

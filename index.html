<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Promethia Quest: Relight the Great Torch</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon-32.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-left">
    <img src="assets/logo-mark-96.png" alt="" class="hud-logo">
    <div><div id="lvlName">Level</div><div id="lvlGoal" class="sub"></div></div>
  </div>
  <div id="progress"></div>
  <div class="hud-right">
    <span id="hearts" class="pill hidden"></span>
    <span class="pill" title="Embers">🔥 <b id="embers">0</b></span>
    <span class="pill" title="Secret stars">⭐ <b id="stars">0</b></span>
    <button id="btnSound" class="icon" title="Sound">🔊</button>
    <button id="btnQuality" class="icon" title="Graphics">✨</button>
  </div>
</div>

<!-- Promo guide -->
<div id="promo" class="hidden">
  <img src="assets/promo.webp" alt="Promo">
  <div id="promoText"></div>
</div>

<div id="actions" class="hidden">
  <button id="btnHint" class="hidden act">💡 Hint</button>
  <button id="btnReset" class="hidden act">↺ Reset</button>
  <button id="btnAct" class="hidden act big">✋ Use</button>
  <button id="btnSkip" class="hidden act ghost">Skip level →</button>
</div>

<div id="dpad" class="hidden">
  <button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
</div>

<div id="buildBar" class="hidden"></div>

<!-- Start screen -->
<div id="start" class="screen">
  <div class="card">
    <img src="assets/promo.webp" class="promo-big" alt="Promo">
    <h1>Promethia <span>Quest</span></h1>
    <p class="tag">Relight the Great Torch!</p>
    <form id="startForm" autocomplete="off">
      <label>Your name<input id="fName" required maxlength="40" placeholder="First and last name"></label>
      <div class="row">
        <label>Grade<select id="fGrade" required><option value="">-</option><option>5</option><option>6</option><option>7</option><option>8</option><option>Other</option></select></label>
        <label>Section<input id="fSection" maxlength="6" placeholder="A"></label>
        <label>Lab PC #<input id="fPC" maxlength="8" placeholder="12"></label>
      </div>
      <button class="btn primary" type="submit">Start the adventure ▶</button>
    </form>
    <p class="small">🎮 Arrow keys / W A S D or tap · About 15 minutes</p>
  </div>
</div>

<!-- Story -->
<div id="story" class="screen hidden">
  <div class="card">
    <div id="storyArt" class="story-art"></div>
    <p id="storyText" class="story-text"></p>
    <button id="storyNext" class="btn primary">Next ▶</button>
  </div>
</div>

<!-- Hero pick -->
<div id="heroPick" class="screen hidden">
  <div class="card">
    <h2>Pick your hero</h2>
    <div id="heroes" class="choices"></div>
    <button id="heroGo" class="btn primary" disabled>Let's go! ▶</button>
  </div>
</div>

<!-- Generic modal -->
<div id="modal" class="screen hidden"><div class="card" id="modalCard"></div></div>

<!-- Level complete banner -->
<div id="banner" class="hidden"><div id="bannerText"></div></div>

<!-- Results -->
<div id="results" class="screen hidden">
  <div class="card results">
    <div class="badge-wrap"><div class="badge" id="badge"><img src="assets/logo-mark.png" alt=""><div id="badgeTitle">Torchbearer</div></div></div>
    <h2 id="resName"></h2>
    <p id="resLine" class="tag"></p>
    <div id="resBadges" class="badges"></div>
    <div id="resStats" class="stats"></div>
    <div id="saveStatus" class="save">Saving…</div>
    <button id="btnNext" class="btn primary huge hidden">Next student →</button>
  </div>
</div>

<div id="fade"></div>
<script src="config.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
